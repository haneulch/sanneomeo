name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 푸시 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # repo Variables (Settings > Secrets and variables > Actions > Variables).
          # 비어 있으면 로그인 버튼이 숨고 CSV 폴백으로 동작 — 빌드는 깨지지 않는다.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # 서버(SSH) 배포 — Variables에 DEPLOY_ENABLED=true 설정 시에만 실행.
  # 필요한 Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DATA_GO_KR_KEY
  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # 패키지가 private면 필요, public이면 무해하게 통과. repo visibility와 무관하다.
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker rm -f sanneomeo 2>/dev/null || true
            docker run -d --name sanneomeo --restart unless-stopped \
              -p 127.0.0.1:3001:3000 \
              --memory=400m --memory-swap=700m \
              -e DATA_GO_KR_KEY='${{ secrets.DATA_GO_KR_KEY }}' \
              -e DATA_STORE_DIR=/app/data/store \
              -v sanneomeo-data:/app/data/store \
              ghcr.io/${{ github.repository }}:latest
            docker image prune -f
